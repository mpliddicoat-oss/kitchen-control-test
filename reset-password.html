<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kitchen Control - Reset Password</title>
<meta name="keywords" content="allergen management, allergen management software, kitchen management, kitchen management software, menu costing, menu costing software, Natasha's Law compliance, HACCP software, food safety software, restaurant management software, catering software, invoice scanning software, label printing software, food cost software, back of house software, kitchen software UK, chef software, hospitality software UK">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#223548,#16222c);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#223548;}
.card{background:#fff;border-radius:14px;padding:40px 32px;max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,0.3);text-align:center;}
.logo{margin-bottom:18px;}
.logo img{max-width:180px;height:auto;}
h1{font-size:20px;font-weight:600;margin-bottom:6px;color:#223548;}
.subtitle{font-size:13px;color:#6b7280;margin-bottom:24px;line-height:1.5;}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;text-align:left;}
label{font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;}
input{padding:11px 14px;border:1px solid #e2e8f0;border-radius:8px;font-size:16px;font-family:inherit;background:#fff;color:#223548;width:100%;transition:border-color .15s;}
input:focus{outline:none;border-color:#7fbf3f;}
.btn{width:100%;padding:11px;background:#7fbf3f;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;margin-top:6px;}
.btn:hover{background:#5a9a25;}
.btn:disabled{background:#9ca3af;cursor:not-allowed;}
.error{color:#dc2626;font-size:13px;margin-top:10px;display:none;background:#fee2e2;padding:10px;border-radius:6px;border:1px solid #fecaca;}
.success{color:#065f46;font-size:13px;margin-top:10px;display:none;background:#d1fae5;padding:10px;border-radius:6px;border:1px solid #6ee7b7;}
.footer{margin-top:20px;font-size:11px;color:#9ca3af;}
</style>
</head>
<body>
<div class="card">
  <div class="logo"><img src="logo.png" alt="Kitchen Control"></div>
  <h1>Set New Password</h1>
  <p class="subtitle">Choose a new password for your Kitchen Control account.</p>

  <div id="form-area">
    <div class="fg">
      <label>New Password</label>
      <input type="password" id="new-pass" placeholder="Minimum 6 characters" autocomplete="new-password">
    </div>
    <div class="fg">
      <label>Confirm Password</label>
      <input type="password" id="confirm-pass" placeholder="Repeat your new password" autocomplete="new-password">
    </div>
    <button class="btn" id="submit-btn" onclick="updatePassword()">Set New Password</button>
    <div class="error" id="err-msg"></div>
    <div class="success" id="ok-msg"></div>
  </div>

  <div id="invalid-area" style="display:none">
    <div class="error" style="display:block">This password reset link is invalid or has expired. Please request a new one.</div>
    <a href="/login.html" style="display:block;margin-top:16px;color:#7fbf3f;font-size:14px;text-decoration:none;">← Request new reset link</a>
  </div>

  <div class="footer">
    <a href="/login.html" style="color:#7fbf3f;text-decoration:none;">← Back to login</a>
    <div style="margin-top:10px;">Kitchen Control &copy; 2026</div>
  </div>
</div>

<script>
var SUPABASE_URL = 'https://qdvektbnhyfzxuxjhorw.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFkdmVrdGJuaHlmenh1eGpob3J3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc5MTA2OTMsImV4cCI6MjA5MzQ4NjY5M30.DOo4wLbkQ-uU5ZdOtdRWGWUr3eOJQ7vEutLubCop1Nw';
var kcSupabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function showErr(msg){ var e=document.getElementById('err-msg'); e.textContent=msg; e.style.display='block'; document.getElementById('ok-msg').style.display='none'; }
function showOk(msg){ var e=document.getElementById('ok-msg'); e.textContent=msg; e.style.display='block'; document.getElementById('err-msg').style.display='none'; }

// On load — check for valid session from the reset link
window.addEventListener('load', function(){
  // Supabase puts tokens in the URL hash
  var hash = window.location.hash;
  if(!hash || hash.indexOf('access_token') < 0){
    // No token — show invalid message
    document.getElementById('form-area').style.display = 'none';
    document.getElementById('invalid-area').style.display = 'block';
    return;
  }
  // Let Supabase handle the token from the hash
  kcSupabase.auth.onAuthStateChange(function(event, session){
    if(event === 'PASSWORD_RECOVERY'){
      // Token is valid, form is ready
      document.getElementById('form-area').style.display = 'block';
    }
  });
});

async function updatePassword(){
  var pass = document.getElementById('new-pass').value;
  var confirm = document.getElementById('confirm-pass').value;
  var btn = document.getElementById('submit-btn');

  if(!pass || pass.length < 6){ showErr('Password must be at least 6 characters.'); return; }
  if(pass !== confirm){ showErr('Passwords do not match.'); return; }

  btn.disabled = true;
  btn.textContent = 'Updating...';

  try{
    var res = await kcSupabase.auth.updateUser({ password: pass });
    if(res.error) throw res.error;
    showOk('Password updated successfully! Taking you to login...');
    document.getElementById('form-area').style.opacity = '0.5';
    setTimeout(function(){ window.location.href = '/login.html'; }, 2000);
  } catch(e){
    showErr(e.message || 'Could not update password. Please request a new reset link.');
    btn.disabled = false;
    btn.textContent = 'Set New Password';
  }
}
</script>
</body>
</html>
